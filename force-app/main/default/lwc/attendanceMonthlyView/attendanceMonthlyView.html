<template>
    <div class="attendance-view-shell">
        <div class="attendance-fixed-area-spacer"></div>
        <div class="attendance-fixed-area">
            <h2 class="attendance-title">Selegic's Attendance Tracker</h2>
            <a class="attendance-export-link slds-hide" tabindex="-1"></a>
            <div class="attendance-tracker-body">
                <div class="attendance-controls">
                    <div class="attendance-date-filters">
                        <div class="attendance-filter">
                            <lightning-combobox
                                name="month"
                                label="Month"
                                value={selectedMonth}
                                options={monthOptions}
                                onchange={handleMonthChange}
                                disabled={isSaving}>
                            </lightning-combobox>
                        </div>
                        <div class="attendance-filter">
                            <lightning-combobox
                                name="year"
                                label="Year"
                                value={selectedYear}
                                options={yearOptions}
                                onchange={handleYearChange}
                                disabled={isSaving}>
                            </lightning-combobox>
                        </div>
                    </div>
                    <div>
                        <lightning-button
                            label="Export to Excel"
                            title="Download this month’s attendance as a CSV file for Excel"
                            icon-name="utility:download"
                            onclick={handleExport}
                            disabled={isExportDisabled}>
                        </lightning-button>
                    </div>
                </div>

                <div class="attendance-grid-section">
                    <div class="attendance-grid-content">
                        <div class="status-legend">
                            <div class="legend-item">
                                <span class="legend-box status-wfh"></span><span>WFH</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-box status-wfo"></span><span>WFO</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-box status-absent"></span><span>Absent</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-box status-none"></span><span>Pending</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-box status-leave"></span><span>Leave</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-box status-wo"></span><span>Weekly Off</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-box status-holiday"></span><span>Holiday</span>
                            </div>
                        </div>

                        <div class="attendance-sticky-header" aria-hidden="true">
                            <div class="attendance-sticky-header-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer attendance-table">
                                    <thead>
                                        <tr>
                                            <th scope="col" class="employee-column">Employee</th>
                                            <template for:each={days} for:item="day">
                                                <th scope="col" key={day.date} class="day-column">
                                                    <div>{day.dayNumber}</div>
                                                    <div>{day.dayName}</div>
                                                </th>
                                            </template>
                                            <th scope="col" class="summary-column">WFH</th>
                                            <th scope="col" class="summary-column">WFO</th>
                                            <th scope="col" class="summary-column">Absent</th>
                                            <th scope="col" class="summary-column" title="Leave taken from January through the selected month">Leave</th>
                                            <th scope="col" class="summary-column leave-summary-column" title="Total allocated leaves from the employee's leave allocation">Total Alloc.</th>
                                            <th scope="col" class="summary-column leave-summary-column remaining-summary-column" title="Allocation less leave taken from January through the selected month">Remaining</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="attendance-grid-scroll slds-is-relative" onscroll={handleGridScroll}>
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading attendance"
                    size="medium">
                </lightning-spinner>
            </template>
            <table class="slds-table slds-table_bordered slds-table_cell-buffer attendance-table">
                <thead class="slds-assistive-text attendance-accessible-header">
                    <tr>
                        <th scope="col" class="employee-column">Employee</th>
                        <template for:each={days} for:item="day">
                            <th scope="col" key={day.date} class="day-column">
                                <div>{day.dayNumber}</div>
                                <div>{day.dayName}</div>
                            </th>
                        </template>
                        <th scope="col" class="summary-column">WFH</th>
                        <th scope="col" class="summary-column">WFO</th>
                        <th scope="col" class="summary-column">Absent</th>
                        <th scope="col" class="summary-column" title="Leave taken from January through the selected month">Leave</th>
                        <th scope="col" class="summary-column leave-summary-column" title="Total allocated leaves from the employee's leave allocation">Total Alloc.</th>
                        <th scope="col" class="summary-column leave-summary-column remaining-summary-column" title="Allocation less leave taken from January through the selected month">Remaining</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={employeeRows} for:item="row">
                        <tr key={row.employeeId}>
                            <th scope="row" class="employee-column">{row.employeeName}</th>
                            <template for:each={row.days} for:item="day">
                                <td key={day.date} class="day-cell" title={day.tooltip}>
                                    <span class={day.statusControlClass}>
                                        <lightning-button-menu
                                            label={day.statusLabel}
                                            alternative-text={day.accessibleLabel}
                                            variant="bare"
                                            size="medium"
                                            menu-alignment="auto"
                                            class="status-menu"
                                            data-employee-id={row.employeeId}
                                            data-date={day.date}
                                            onselect={handleCellStatusChange}
                                            disabled={isSaving}>
                                            <template for:each={day.statusOptions} for:item="option">
                                                <lightning-menu-item
                                                    key={option.value}
                                                    label={option.label}
                                                    value={option.value}
                                                    checked={option.checked}>
                                                </lightning-menu-item>
                                            </template>
                                        </lightning-button-menu>
                                    </span>
                                </td>
                            </template>
                            <td class="summary-cell">{row.wfhCount}</td>
                            <td class="summary-cell">{row.wfoCount}</td>
                            <td class="summary-cell">{row.absentCount}</td>
                            <td class="summary-cell">{row.leaveCount}</td>
                            <td class="summary-cell leave-summary-cell">{row.allocatedLeaveCount}</td>
                            <td class="summary-cell leave-summary-cell remaining-summary-column">{row.remainingLeaveCount}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>
